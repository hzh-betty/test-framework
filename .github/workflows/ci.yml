name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.23'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run --no-sync pytest -q
      - run: uv build
      - name: Smoke installed wheel
        shell: bash
        run: uv run --isolated --no-project --with "$(ls dist/*.whl)" webtest run examples/smoke.yaml --config examples/runtime.yaml --dry-run --html-report --allure --output-dir artifacts/wheel-smoke
